name: kickoff_gestionnaire
description: Kickoff — application Gestionnaire (création et pilotage de compétitions).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  get: ^4.6.6
  intl: ^0.19.0

  # Code partagé avec l'app Fans (thème, modèles...). Dépendance de
  # chemin local : pas besoin de le publier sur pub.dev, Flutter le
  # résout directement depuis le dossier voisin dans le monorepo.
  kickoff_core:
    path: ../../packages/kickoff_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets: 
  - assets/images/logo2.png
  - assets/images/icon_mark.png
